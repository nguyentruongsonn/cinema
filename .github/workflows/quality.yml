name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer test:structure
      - run: composer analyse
      - run: composer test:modern-format
      - run: npm run lint
      - run: npm run test:frontend:syntax
      - run: npm run test:frontend:security
      - run: npm run build
      - run: php artisan test
      - run: npm run test:browser:smoke
      - run: npm run test:browser:admin-pos
      - run: npm run test:browser:auth-expiry
      - run: composer audit
      - run: npm audit --audit-level=moderate
